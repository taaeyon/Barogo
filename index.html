<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바로고시스템 - 악취종합병원 AI 솔루션</title>
  
  <!-- Tailwind CSS (스타일링) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Babel Standalone (브라우저에서 React JSX를 변환) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Import Map (React 및 외부 라이브러리 연결) -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0",
        "recharts": "https://esm.sh/recharts@2.10.3"
      }
    }
  </script>

  <style>
    /* 스크롤바 숨김 등 기본 스타일 보정 */
    body { margin: 0; padding: 0; overflow: hidden; }
  </style>
</head>
<body>
  <!-- React 앱이 표시될 공간 -->
  <div id="root"></div>

  <!-- 실제 React 코드 (type="text/babel" data-type="module" 필수) -->
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      Activity, Home, ClipboardList, Stethoscope, Pill, BarChart3, 
      Settings, User, Bell, ChevronRight, CheckCircle2, AlertTriangle, Download, 
      Wind, Droplets, Thermometer, Factory, Video, PlayCircle, FileText, CheckCircle
    } from 'lucide-react';
    import { 
      Radar, RadarChart, PolarGrid, PolarAngleAxis, PolarRadiusAxis, ResponsiveContainer,
      LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, Area, AreaChart
    } from 'recharts';

    // 메인 앱 컴포넌트
    function App() {
      const [activeTab, setActiveTab] = useState('overview');
      const [selectedOdor, setSelectedOdor] = useState('vocs');

      const navItems = [
        { id: 'overview', label: '🏥 종합안내', icon: Home },
        { id: 'intake', label: '📝 접수·문진', icon: ClipboardList },
        { id: 'diagnosis', label: '🔬 AI 진단 및 설계', icon: Stethoscope },
        { id: 'video', label: '📺 AI 영상 처방전', icon: Video },
        { id: 'management', label: '🌐 디지털트윈 관제', icon: BarChart3 },
      ];

      return (
        <div className="flex h-screen bg-slate-50 font-sans text-slate-800 overflow-hidden w-full">
          {/* Sidebar */}
          <aside className="w-64 bg-slate-900 text-white flex flex-col shadow-xl z-10 hidden md:flex">
            <div className="p-6 flex items-center gap-3 border-b border-slate-700">
              <div className="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-xl shadow-lg shadow-blue-600/30">B</div>
              <div>
                <h1 className="text-xl font-bold tracking-tight">바로고시스템<span className="text-blue-400">.</span></h1>
                <p className="text-xs text-slate-400">악취종합병원 AI 솔루션</p>
              </div>
            </div>
            
            <nav className="flex-1 py-6 px-4 space-y-2">
              {navItems.map((item) => {
                const Icon = item.icon;
                const isActive = activeTab === item.id;
                return (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 text-left ${
                      isActive 
                        ? 'bg-blue-500/10 text-blue-400 border border-blue-500/20 shadow-sm' 
                        : 'text-slate-400 hover:bg-slate-800 hover:text-white'
                    }`}
                  >
                    <Icon size={20} className={isActive ? 'text-blue-400' : ''} />
                    <span className="font-medium">{item.label}</span>
                  </button>
                );
              })}
            </nav>

            <div className="p-4 border-t border-slate-800">
              <div className="flex items-center gap-3 px-2 py-2">
                <div className="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center">
                  <User size={16} />
                </div>
                <div className="text-sm">
                  <p className="font-medium text-slate-200">태성환경연구소</p>
                  <p className="text-xs text-slate-500">관리자 계정</p>
                </div>
              </div>
            </div>
          </aside>

          {/* Main Content */}
          <main className="flex-1 flex flex-col h-full overflow-hidden">
            <header className="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 shrink-0">
              <h2 className="text-lg font-semibold text-slate-800">
                {navItems.find(i => i.id === activeTab)?.label.split(' ')[1]}
              </h2>
              <div className="flex items-center gap-4">
                <button className="relative p-2 text-slate-400 hover:text-slate-600 transition-colors">
                  <Bell size={20} />
                  <span className="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                </button>
                <button className="p-2 text-slate-400 hover:text-slate-600 transition-colors">
                  <Settings size={20} />
                </button>
              </div>
            </header>

            <div className="flex-1 overflow-auto p-8">
              <div className="max-w-6xl mx-auto">
                {activeTab === 'overview' && <OverviewView setActiveTab={setActiveTab} />}
                {activeTab === 'intake' && <IntakeView setActiveTab={setActiveTab} setSelectedOdor={setSelectedOdor} />}
                {activeTab === 'diagnosis' && <DiagnosisView selectedOdor={selectedOdor} />}
                {activeTab === 'video' && <VideoView selectedOdor={selectedOdor} />}
                {activeTab === 'management' && <ManagementView />}
              </div>
            </div>
          </main>
        </div>
      );
    }

    function OverviewView({ setActiveTab }) {
      return (
        <div className="space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-500">
          <div className="relative overflow-hidden rounded-3xl bg-slate-900 text-white p-10 md:p-14 shadow-2xl">
            <div className="absolute top-0 right-0 -mr-20 -mt-20 w-96 h-96 bg-blue-500/20 rounded-full blur-3xl"></div>
            <div className="relative z-10 max-w-2xl">
              <span className="inline-block py-1 px-3 rounded-full bg-blue-500/20 text-blue-400 text-sm font-semibold mb-4 border border-blue-500/30">
                태성환경연구소 혁신 프로젝트
              </span>
              <h1 className="text-4xl md:text-5xl font-extrabold mb-6 leading-tight">
                진단 · 처방 · 관제 <br />
                <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-teal-300">
                  악취종합병원 바로고시스템
                </span>
              </h1>
              <p className="text-slate-300 text-lg mb-8 leading-relaxed">
                인력 투입은 최소화하고 정확도는 극대화합니다. AI가 악취 성분을 분석하여 가장 완벽한 화학공학적 저감 솔루션을 즉각 처방합니다.
              </p>
              <button 
                onClick={() => setActiveTab('intake')}
                className="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-medium transition-all shadow-lg shadow-blue-600/30"
              >
                접수 시작하기 <ChevronRight size={18} />
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mt-10">
            {[
              { step: '01', title: '스마트 접수/문진', desc: 'IoT 센서 연동 및 기업 맞춤형 기초 데이터(유량, 온도 등) 입력', icon: ClipboardList, color: 'text-blue-500', bg: 'bg-blue-50' },
              { step: '02', title: 'AI 진단 및 처방', desc: '화공 알고리즘 기반 1:1 맞춤형 저감장치 설계 및 영상 큐레이션', icon: Stethoscope, color: 'text-teal-600', bg: 'bg-teal-50' },
              { step: '03', title: '디지털 트윈 관제', desc: '악취 확산 역추적 시뮬레이션 및 예지보전 시스템', icon: BarChart3, color: 'text-indigo-500', bg: 'bg-indigo-50' }
            ].map((item, idx) => {
              const IconComp = item.icon;
              return (
                <div key={idx} className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition-shadow relative overflow-hidden group">
                  <div className={`w-14 h-14 rounded-2xl ${item.bg} flex items-center justify-center mb-6 group-hover:scale-110 transition-transform`}>
                    <IconComp className={item.color} size={28} />
                  </div>
                  <div className="text-5xl font-black text-slate-50 absolute top-4 right-4 z-0">{item.step}</div>
                  <div className="relative z-10">
                    <h3 className="text-xl font-bold text-slate-800 mb-3">{item.title}</h3>
                    <p className="text-slate-500 leading-relaxed">{item.desc}</p>
                  </div>
                </div>
              )
            })}
          </div>
        </div>
      );
    }

    function IntakeView({ setActiveTab, setSelectedOdor }) {
      const [status, setStatus] = useState('idle');
      const [odorType, setOdorType] = useState('vocs');

      const handleSubmit = (e) => {
        e.preventDefault();
        setStatus('loading');
        setTimeout(() => {
          setSelectedOdor(odorType);
          setActiveTab('diagnosis');
        }, 1500);
      };

      if (status === 'success') {
        return (
          <div className="h-full flex flex-col items-center justify-center animate-in fade-in zoom-in duration-300">
            <div className="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center mb-6">
              <CheckCircle2 size={40} className="text-emerald-500" />
            </div>
            <h2 className="text-2xl font-bold text-slate-800 mb-2">접수가 완료되었습니다</h2>
            <p className="text-slate-500 text-center mb-8">
              입력하신 데이터가 AI 진단센터로 안전하게 이관되었습니다.<br />
              '진단센터' 메뉴에서 분석 결과를 확인해주세요.
            </p>
            <button 
              onClick={() => setStatus('idle')}
              className="px-6 py-2 border border-slate-200 text-slate-600 rounded-lg hover:bg-slate-50 transition-colors"
            >
              새로운 접수하기
            </button>
          </div>
        );
      }

      return (
        <div className="max-w-3xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
          <div className="bg-slate-900 px-8 py-6 text-white">
            <h2 className="text-xl font-semibold flex items-center gap-2">
              <ClipboardList size={22} className="text-emerald-400" />
              초기 기초 문진표 작성
            </h2>
            <p className="text-slate-400 text-sm mt-2">정확한 처방을 위해 배출원의 현장 정보를 입력해주세요.</p>
          </div>
          <form onSubmit={handleSubmit} className="p-8 space-y-8">
            <div className="space-y-6">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div className="space-y-2">
                  <label className="text-sm font-medium text-slate-700 flex items-center gap-2">
                    <Factory size={16} className="text-slate-400" /> 사업장 업종
                  </label>
                  <select required className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none">
                    <option value="">업종을 선택하세요</option>
                    <option value="chemical">화학물질 제조 (석유화학 등)</option>
                    <option value="plating">표면처리 및 도금</option>
                    <option value="food">식품 제조 및 가공</option>
                  </select>
                </div>
                <div className="space-y-2">
                  <label className="text-sm font-medium text-slate-700 flex items-center gap-2">
                    <Wind size={16} className="text-slate-400" /> 주 체감 악취
                  </label>
                  <select required value={odorType} onChange={(e) => setOdorType(e.target.value)} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none">
                    <option value="vocs">고농도 VOCs (유증기 및 유기용제)</option>
                    <option value="complex">복합 악취 (황화수소, 암모니아 등)</option>
                  </select>
                </div>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div className="space-y-2">
                  <label className="text-sm font-medium text-slate-700 flex items-center gap-2">
                    <Wind size={16} className="text-slate-400" /> 설계 풍량 (CMM)
                  </label>
                  <input type="number" required placeholder="예: 300" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none" />
                </div>
                <div className="space-y-2">
                  <label className="text-sm font-medium text-slate-700 flex items-center gap-2">
                    <Thermometer size={16} className="text-slate-400" /> 배출 가스 온도 (℃)
                  </label>
                  <input type="number" required placeholder="예: 45" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none" />
                </div>
              </div>
            </div>
            <div className="pt-4 flex justify-end">
              <button 
                type="submit" 
                disabled={status === 'loading'}
                className="bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-3 rounded-xl font-medium transition-colors flex items-center gap-2 disabled:opacity-70"
              >
                {status === 'loading' ? (
                  <><Activity className="animate-spin" size={20} /> AI 분석 진행중...</>
                ) : 'AI 진단 의뢰하기'}
              </button>
            </div>
          </form>
        </div>
      );
    }

    function DiagnosisView({ selectedOdor }) {
      const isVocs = selectedOdor === 'vocs';
      const radarData = isVocs ? [
        { subject: '톨루엔(VOC)', A: 95, fullMark: 100 },
        { subject: '자일렌(VOC)', A: 85, fullMark: 100 },
        { subject: '벤젠(VOC)', A: 70, fullMark: 100 },
        { subject: '황화수소(H2S)', A: 20, fullMark: 100 },
        { subject: '암모니아(NH3)', A: 10, fullMark: 100 },
        { subject: '기타(지방산)', A: 15, fullMark: 100 },
      ] : [
        { subject: '황화수소(H2S)', A: 90, fullMark: 100 },
        { subject: '암모니아(NH3)', A: 85, fullMark: 100 },
        { subject: '메틸메르캅탄', A: 75, fullMark: 100 },
        { subject: '아민류', A: 60, fullMark: 100 },
        { subject: '톨루엔(VOC)', A: 30, fullMark: 100 },
        { subject: '기타(알데히드)', A: 40, fullMark: 100 },
      ];

      return (
        <div className="space-y-6">
          <div className="bg-gradient-to-r from-blue-600 to-teal-500 rounded-2xl p-8 text-white shadow-lg relative overflow-hidden">
            <div className="relative z-10 flex flex-col md:flex-row gap-8 items-center">
              <div className="flex-1">
                <div className="flex items-center gap-2 mb-3">
                  <CheckCircle size={20} className="text-teal-200" />
                  <span className="text-teal-100 font-semibold tracking-wide">AI 맞춤형 화학공학 솔루션</span>
                </div>
                <h3 className="text-2xl font-bold mb-4">
                  {isVocs ? "물리적 응축 기반 VRU 설비 도입" : "폐음료 재활용 다공성 탄소 흡착제 적용"}
                </h3>
                <p className="text-blue-100 text-sm">
                  {isVocs ? "물리적 응축 방식을 적용하여 VOCs를 회수하고 압력 손실을 최소화하는 최적의 시스템을 설계했습니다." : "촉매 반응을 통해 99% 이상의 악취 제거 효율을 기대할 수 있습니다."}
                </p>
              </div>
              <div className="bg-white/10 backdrop-blur-md rounded-2xl p-6 w-full md:w-64 text-center">
                <div className="text-blue-100 text-sm mb-2 font-medium">예상 제거 효율</div>
                <div className="text-5xl font-black text-white mb-2">{isVocs ? '95' : '99'}<span className="text-2xl">%</span></div>
              </div>
            </div>
          </div>

          <div className="bg-red-50 border-l-4 border-red-500 p-4 flex items-start gap-4">
            <AlertTriangle className="text-red-500 shrink-0" size={24} />
            <div>
              <h3 className="font-bold text-red-800">AI 판독 결과 (위험도: 높음)</h3>
              <p className="text-red-600 mt-1 text-sm">
                {isVocs ? "고농도 VOCs 유증기 발생. 화재 위험 방지 처리가 시급합니다." : "황화수소 중심 고농도 복합 악취 발생. 화학적 흡착 처리가 요구됩니다."}
              </p>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
              <h3 className="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2">
                <Activity size={20} className="text-indigo-500" /> AI 다차원 악취 지문
              </h3>
              <div className="h-80">
                <ResponsiveContainer width="100%" height="100%">
                  <RadarChart cx="50%" cy="50%" outerRadius="80%" data={radarData}>
                    <PolarGrid stroke="#e2e8f0" />
                    <PolarAngleAxis dataKey="subject" tick={{ fill: '#475569', fontSize: 12 }} />
                    <PolarRadiusAxis angle={30} domain={[0, 100]} />
                    <Radar dataKey="A" stroke="#10b981" fill="#10b981" fillOpacity={0.4} />
                    <Tooltip />
                  </RadarChart>
                </ResponsiveContainer>
              </div>
            </div>

            <div className="space-y-4">
              <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                <h3 className="text-sm font-bold text-slate-500 mb-4">주요 검출 물질</h3>
                <div className="space-y-4">
                  {[
                    { name: '황화수소', val: '45.2', unit: 'ppm', color: 'text-red-500', bar: 'bg-red-500', width: 'w-[85%]' },
                    { name: '톨루엔', val: '120.5', unit: 'ppm', color: 'text-red-500', bar: 'bg-red-500', width: 'w-[90%]' },
                    { name: '메틸메르캅탄', val: '2.8', unit: 'ppm', color: 'text-orange-500', bar: 'bg-orange-500', width: 'w-[75%]' },
                  ].map((item, idx) => (
                    <div key={idx} className="space-y-1">
                      <div className="flex justify-between items-end">
                        <span className="font-medium text-slate-700">{item.name}</span>
                        <span className="text-sm"><strong className={item.color}>{item.val}</strong> {item.unit}</span>
                      </div>
                      <div className="w-full h-2 bg-slate-100 rounded-full">
                        <div className={`h-full ${item.bar} ${item.width} rounded-full`}></div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function VideoView({ selectedOdor }) {
      const isVocs = selectedOdor === 'vocs';
      const recommendedVideos = isVocs ? [
        { id: 1, title: "VRU 설비 시공 및 운영 사례", desc: "고농도 VOCs 완벽 회수 솔루션", videoId: "T_mptCb0Qq8" },
        { id: 2, title: "실시간 VOCs 모니터링 구축", desc: "유증기 유출 실시간 감지", videoId: "rMtsyx46hDM" },
        { id: 3, title: "스마트 플랜트 유체역학 설계", desc: "압력 손실 최소화 설계", videoId: "vq2-MdIsaiE" }
      ] : [
        { id: 1, title: "복합 악취 정밀 측정 기법", desc: "인간 취기 수준 분석", videoId: "T_mptCb0Qq8" },
        { id: 2, title: "폐음료 재활용 흡착제 적용", desc: "ESG 경영 흡착제", videoId: "rMtsyx46hDM" },
        { id: 3, title: "드론 활용 악취 3D 추적", desc: "산단 풍향 기반 역추적", videoId: "vq2-MdIsaiE" }
      ];

      return (
        <div className="space-y-6">
          <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
            <h3 className="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
              <Video size={24} className="text-blue-600" /> AI 영상 큐레이션
            </h3>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              {recommendedVideos.map((video) => (
                <a key={video.id} href={`https://www.youtube.com/watch?v=${video.videoId}`} target="_blank" className="group block cursor-pointer">
                  <div className="w-full aspect-video rounded-xl mb-4 relative overflow-hidden bg-slate-900">
                    <img src={`https://img.youtube.com/vi/${video.videoId}/hqdefault.jpg`} alt={video.title} className="w-full h-full object-cover opacity-80 group-hover:opacity-100" />
                    <div className="absolute inset-0 flex items-center justify-center">
                      <PlayCircle size={40} className="text-white opacity-70 group-hover:opacity-100" />
                    </div>
                  </div>
                  <h4 className="font-bold text-slate-800 group-hover:text-blue-600">{video.title}</h4>
                  <p className="text-sm text-slate-500">{video.desc}</p>
                </a>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function ManagementView() {
      const data = [
        { time: '00:00', vocs: 30, limit: 100 }, { time: '04:00', vocs: 25, limit: 100 },
        { time: '08:00', vocs: 45, limit: 100 }, { time: '12:00', vocs: 85, limit: 100 },
        { time: '16:00', vocs: 140, limit: 100 }, { time: '20:00', vocs: 60, limit: 100 },
        { time: '24:00', vocs: 35, limit: 100 },
      ];

      return (
        <div className="space-y-6">
          <div className="bg-gradient-to-r from-amber-500 to-orange-500 rounded-2xl p-6 text-white shadow-lg flex items-center justify-between">
            <div className="flex items-center gap-4">
              <Bell size={28} className="text-white" />
              <div>
                <h3 className="text-xl font-bold">1공장 옥상 세정집진기 이상 징후 감지</h3>
                <p className="text-amber-100 mt-1">48시간 내에 가성소다(NaOH) 탱크 보충 요망.</p>
              </div>
            </div>
          </div>
          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h3 className="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2">
              <Activity size={20} className="text-blue-500" /> 배출량 역추적 트렌드
            </h3>
            <div className="h-72">
              <ResponsiveContainer width="100%" height="100%">
                <AreaChart data={data}>
                  <XAxis dataKey="time" />
                  <YAxis />
                  <Tooltip />
                  <Legend />
                  <Area type="monotone" dataKey="vocs" stroke="#3b82f6" fill="#bfdbfe" />
                  <Line type="step" dataKey="limit" stroke="#ef4444" strokeDasharray="5 5" />
                </AreaChart>
              </ResponsiveContainer>
            </div>
          </div>
        </div>
      );
    }

    // 앱 실행
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
