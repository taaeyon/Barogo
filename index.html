<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바로고시스템 - 태성환경연구소</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [activeMenu, setActiveMenu] = useState('reception');
            const [issueType, setIssueType] = useState('고농도 VOCs (유증기 등)');
            const [isDiagnosing, setIsDiagnosing] = useState(false);
            const [diagnosisResult, setDiagnosisResult] = useState(null);

            const handleDiagnose = () => {
                setIsDiagnosing(true);
                setTimeout(() => {
                    if (issueType.includes('VOCs')) {
                        setDiagnosisResult({
                            type: 'VOCs',
                            title: '물리적 응축 기반 VRU 설비 도입',
                            desc: '입력된 풍량과 온도를 기반으로 유체역학적 차압 계산이 완료되었습니다. 기존 설비 대비 압력 손실을 최소화하면서 98% 이상의 고농도 VOCs 회수 효율을 기대할 수 있습니다.',
                            videos: [
                                { id: 'T_mptCb0Qq8', title: '태성환경연구소 악취 통합솔루션', desc: '설계, 시공, AI-AX, 모니터링' },
                                { id: 'rMtsyx46hDM', title: '악취 모니터링 장비 출품', desc: '인간이 느끼는 취기 수준으로 표현 가능' },
                                { id: 'XCvC0ckXjl0', title: '태성드론 소개', desc: '상공 VOCs 포집 및 정밀 측정' }
                            ]
                        });
                    } else {
                        setDiagnosisResult({
                            type: 'Odor',
                            title: '폐음료 재활용 다공성 탄소 흡착제 및 알칼리 금속염(MgO) 적용',
                            desc: '유입 가스의 복합 성분(H2S, NH3 등) 분석 결과, 다공성 탄소 흡착제가 가장 경제적입니다. AI 파과곡선 시뮬레이션 결과 예상 교체 주기는 45일입니다.',
                            videos: [
                                { id: 'PO7REfpXxOM', title: '여천매립지 악취방지 대책', desc: '복합 악취 저감장치 적용 사례' },
                                { id: 'vq2-MdIsaiE', title: '울산 세계 미래산업 박람회', desc: '다공성 탄소 흡착제 관련 기술 소개' },
                                { id: 'T_mptCb0Qq8', title: '태성환경연구소 통합솔루션', desc: '맞춤형 흡착탑 설계 및 시공' }
                            ]
                        });
                    }
                    setIsDiagnosing(false);
                    setActiveMenu('diagnosis');
                }, 1500);
            };

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* Sidebar */}
                    <div className="w-64 bg-slate-900 text-white flex flex-col shadow-xl z-10">
                        <div className="p-6 bg-blue-700">
                            <h1 className="text-xl font-bold">바로고시스템.</h1>
                            <p className="text-xs text-blue-200 mt-1">태성환경연구소 AI 솔루션</p>
                        </div>
                        <nav className="flex-1 p-4 space-y-2">
                            <button onClick={() => setActiveMenu('reception')} className={`w-full flex items-center p-3 rounded-lg transition-colors ${activeMenu === 'reception' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>
                                📝 접수·문진
                            </button>
                            <button onClick={() => setActiveMenu('diagnosis')} className={`w-full flex items-center p-3 rounded-lg transition-colors ${activeMenu === 'diagnosis' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>
                                🩺 AI 진단 및 설계
                            </button>
                        </nav>
                        <div className="p-4 bg-slate-800 text-xs text-slate-400">
                            (주)태성환경연구소<br/>2027 인턴십 과제 프로토타입
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 flex flex-col h-full bg-slate-50 overflow-y-auto">
                        <header className="bg-white p-6 shadow-sm flex justify-between items-center border-b">
                            <h2 className="text-2xl font-bold text-slate-800">
                                {activeMenu === 'reception' ? 'AI 문진표 작성' : 'AI 처방전 및 맞춤 영상'}
                            </h2>
                            <span className="bg-blue-100 text-blue-800 text-xs px-3 py-1 rounded-full font-semibold">
                                담당자: OOO 지원자
                            </span>
                        </header>

                        <main className="p-8 max-w-5xl mx-auto w-full">
                            {activeMenu === 'reception' && (
                                <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
                                    <h3 className="text-lg font-bold text-slate-800 mb-6">현장 상황을 입력해 주세요</h3>
                                    <div className="space-y-6">
                                        <div>
                                            <label className="block text-sm font-semibold text-slate-700 mb-2">발생 주요 악취 성분 (AI 분석 트리거)</label>
                                            <select 
                                                value={issueType} 
                                                onChange={(e) => setIssueType(e.target.value)}
                                                className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                            >
                                                <option>고농도 VOCs (유증기 등)</option>
                                                <option>복합 악취 (황화수소, 암모니아 등)</option>
                                            </select>
                                            <p className="text-xs text-slate-500 mt-2">* 선택한 성분에 따라 AI 화공 설계 로직과 추천 유튜브 영상이 다르게 출력됩니다.</p>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold text-slate-700 mb-2">배출 풍량 (CMM)</label>
                                            <input type="number" defaultValue="350" className="w-full p-3 border border-slate-300 rounded-lg" />
                                        </div>
                                        <button 
                                            onClick={handleDiagnose}
                                            disabled={isDiagnosing}
                                            className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all"
                                        >
                                            {isDiagnosing ? 'AI가 유체역학 및 흡착 데이터를 분석 중입니다...' : 'AI 진단 요청하기'}
                                        </button>
                                    </div>
                                </div>
                            )}

                            {activeMenu === 'diagnosis' && diagnosisResult && (
                                <div className="space-y-6">
                                    {/* AI 처방 결과 */}
                                    <div className="bg-gradient-to-r from-blue-600 to-teal-500 p-8 rounded-2xl text-white shadow-lg relative overflow-hidden">
                                        <h3 className="text-blue-100 text-sm font-bold mb-2">✔️ AI 맞춤형 화학공학 솔루션</h3>
                                        <h2 className="text-2xl font-bold mb-4">{diagnosisResult.title}</h2>
                                        <p className="text-blue-50 text-sm leading-relaxed w-4/5">{diagnosisResult.desc}</p>
                                        <div className="absolute top-8 right-8 text-right">
                                            <div className="text-5xl font-extrabold">98%</div>
                                            <div className="text-blue-100 text-xs mt-1">예상 악취 제거 효율</div>
                                        </div>
                                    </div>

                                    {/* 유튜브 큐레이션 */}
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mt-8">
                                        <div className="flex justify-between items-center mb-6">
                                            <div>
                                                <h3 className="text-lg font-bold flex items-center text-slate-800">
                                                    📺 태성환경연구소 AI 영상 큐레이션
                                                </h3>
                                                <p className="text-sm text-slate-500 mt-1">당사가 보유한 230개의 공식 영상 중, 현재 솔루션 도입에 가장 적합한 3개를 AI가 선별했습니다.</p>
                                            </div>
                                            <a href="https://www.youtube.com/@taesungenvironmentalresear8494" target="_blank" className="text-blue-600 text-sm font-semibold hover:underline">전체 영상 보기 &gt;</a>
                                        </div>
                                        
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                            {diagnosisResult.videos.map((video, idx) => (
                                                <div key={idx} className="group cursor-pointer">
                                                    <a href={`https://www.youtube.com/watch?v=${video.id}`} target="_blank">
                                                        <div className="relative rounded-xl overflow-hidden aspect-video bg-black mb-3">
                                                            <img src={`https://img.youtube.com/vi/${video.id}/maxresdefault.jpg`} className="w-full h-full object-cover opacity-80 group-hover:opacity-100 group-hover:scale-105 transition-all" alt="썸네일" />
                                                            <div className="absolute inset-0 flex items-center justify-center">
                                                                <div className="w-12 h-12 bg-red-600 text-white rounded-full flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform">
                                                                    ▶
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <h4 className="font-bold text-sm text-slate-800 line-clamp-2">{video.title}</h4>
                                                        <p className="text-xs text-slate-500 mt-1">{video.desc}</p>
                                                    </a>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeMenu === 'diagnosis' && !diagnosisResult && (
                                <div className="text-center py-20 text-slate-500">
                                    좌측 '접수·문진' 탭에서 현장 상황을 먼저 입력해 주세요.
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
