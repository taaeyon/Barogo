<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바로고시스템 - 태성환경연구소</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('overview');
            const [selectedOdor, setSelectedOdor] = useState('vocs');

            const navItems = [
                { id: 'overview', label: '🏥 종합안내', icon: '🏠' },
                { id: 'intake', label: '📝 접수·문진', icon: '📋' },
                { id: 'diagnosis', label: '🔬 AI 진단 및 설계', icon: '🩺' },
                { id: 'video', label: '📺 AI 영상 처방전', icon: '🎞️' },
                { id: 'management', label: '🌐 디지털트윈 관제', icon: '📊' },
            ];

            return (
                <div className="flex h-screen bg-slate-50 text-slate-800 overflow-hidden">
                    {/* Sidebar */}
                    <aside className="w-64 bg-slate-900 text-white flex flex-col shadow-xl z-10 hidden md:flex">
                        <div className="p-6 flex items-center gap-3 border-b border-slate-700">
                            <div className="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-xl shadow-lg">B</div>
                            <div>
                                <h1 className="text-xl font-bold tracking-tight">바로고시스템<span className="text-blue-400">.</span></h1>
                                <p className="text-xs text-slate-400">악취종합병원 AI 솔루션</p>
                            </div>
                        </div>
                        
                        <nav className="flex-1 py-6 px-4 space-y-2">
                            {navItems.map((item) => {
                                const isActive = activeTab === item.id;
                                return (
                                    <button
                                        key={item.id}
                                        onClick={() => setActiveTab(item.id)}
                                        className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 text-left ${
                                            isActive 
                                                ? 'bg-blue-500/20 text-blue-400 border border-blue-500/20 shadow-sm' 
                                                : 'text-slate-400 hover:bg-slate-800 hover:text-white'
                                        }`}
                                    >
                                        <span className="text-xl">{item.icon}</span>
                                        <span className="font-medium">{item.label}</span>
                                    </button>
                                );
                            })}
                        </nav>

                        <div className="p-4 border-t border-slate-800 flex items-center gap-3">
                            <div className="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center">👤</div>
                            <div className="text-sm">
                                <p className="font-medium text-slate-200">태성환경연구소</p>
                                <p className="text-xs text-slate-500">관리자 계정</p>
                            </div>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 flex flex-col h-full overflow-hidden">
                        <header className="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 shrink-0">
                            <h2 className="text-lg font-semibold text-slate-800">
                                {navItems.find(i => i.id === activeTab)?.label}
                            </h2>
                            <div className="flex items-center gap-4">
                                <button className="relative p-2 text-slate-400 hover:text-slate-600 transition-colors">
                                    🔔 <span className="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                                </button>
                            </div>
                        </header>

                        <div className="flex-1 overflow-auto p-8">
                            <div className="max-w-6xl mx-auto">
                                {activeTab === 'overview' && <OverviewView setActiveTab={setActiveTab} />}
                                {activeTab === 'intake' && <IntakeView setActiveTab={setActiveTab} setSelectedOdor={setSelectedOdor} />}
                                {activeTab === 'diagnosis' && <DiagnosisView selectedOdor={selectedOdor} />}
                                {activeTab === 'video' && <VideoView selectedOdor={selectedOdor} />}
                                {activeTab === 'management' && <ManagementView />}
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        function OverviewView({ setActiveTab }) {
            return (
                <div className="space-y-8 animate-fade-in">
                    <div className="relative overflow-hidden rounded-3xl bg-slate-900 text-white p-10 md:p-14 shadow-2xl">
                        <div className="absolute top-0 right-0 -mr-20 -mt-20 w-96 h-96 bg-blue-500/20 rounded-full blur-3xl"></div>
                        <div className="relative z-10 max-w-2xl">
                            <span className="inline-block py-1 px-3 rounded-full bg-blue-500/20 text-blue-400 text-sm font-semibold mb-4 border border-blue-500/30">
                                태성환경연구소 인턴 기획안
                            </span>
                            <h1 className="text-4xl font-extrabold mb-6 leading-tight">
                                진단 · 처방 · 관제 <br />
                                <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-teal-300">
                                    악취종합병원 바로고시스템
                                </span>
                            </h1>
                            <p className="text-slate-300 text-lg mb-8 leading-relaxed">
                                인력 투입은 최소화하고 정확도는 극대화합니다. AI가 현장 화학 데이터를 분석하여 최적의 저감 솔루션을 즉각 처방합니다.
                            </p>
                            <button 
                                onClick={() => setActiveTab('intake')}
                                className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-medium shadow-lg transition-all"
                            >
                                접수 시작하기 ➔
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function IntakeView({ setActiveTab, setSelectedOdor }) {
            const [status, setStatus] = useState('idle');
            const [odorType, setOdorType] = useState('vocs');

            const handleSubmit = (e) => {
                e.preventDefault();
                setStatus('loading');
                setTimeout(() => {
                    setSelectedOdor(odorType);
                    setActiveTab('diagnosis');
                }, 1500);
            };

            return (
                <div className="max-w-3xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden animate-fade-in">
                    <div className="bg-slate-900 px-8 py-6 text-white">
                        <h2 className="text-xl font-semibold flex items-center gap-2">📋 현장 기초 문진표 작성</h2>
                        <p className="text-slate-400 text-sm mt-2">정확한 AI 처방을 위해 배출원 정보를 입력해주세요.</p>
                    </div>
                    
                    <form onSubmit={handleSubmit} className="p-8 space-y-8">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="space-y-2">
                                <label className="text-sm font-bold text-slate-700">사업장 업종</label>
                                <select required className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none">
                                    <option value="">업종 선택</option>
                                    <option>화학물질 제조 (석유화학 등)</option>
                                    <option>폐기물 처리업</option>
                                </select>
                            </div>
                            <div className="space-y-2">
                                <label className="text-sm font-bold text-slate-700">주 체감 악취 (AI 진단 기준)</label>
                                <select required value={odorType} onChange={(e) => setOdorType(e.target.value)} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none border-blue-400">
                                    <option value="vocs">고농도 VOCs (유증기 등)</option>
                                    <option value="complex">복합 악취 (황화수소 등)</option>
                                </select>
                            </div>
                            <div className="space-y-2">
                                <label className="text-sm font-bold text-slate-700">설계 풍량 (CMM)</label>
                                <input type="number" required defaultValue="350" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none" />
                            </div>
                        </div>

                        <div className="pt-4 flex justify-end">
                            <button 
                                type="submit" 
                                disabled={status === 'loading'}
                                className="bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-4 rounded-xl font-bold transition-colors w-full md:w-auto"
                            >
                                {status === 'loading' ? '⏳ AI 유체역학 및 흡착 데이터 분석중...' : 'AI 진단 의뢰하기'}
                            </button>
                        </div>
                    </form>
                </div>
            );
        }

        function DiagnosisView({ selectedOdor }) {
            const isVocs = selectedOdor === 'vocs';
            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="bg-gradient-to-r from-blue-600 to-teal-500 rounded-2xl p-8 text-white shadow-lg relative overflow-hidden">
                        <div className="relative z-10 flex flex-col md:flex-row gap-8 items-center">
                            <div className="flex-1">
                                <span className="bg-teal-700 text-teal-100 text-xs font-bold px-3 py-1 rounded-full mb-4 inline-block">AI 맞춤형 화학공학 솔루션</span>
                                <h3 className="text-2xl font-bold mb-4 leading-snug">
                                    {isVocs ? "물리적 응축 기반 VRU 설비 도입" : "폐음료 재활용 다공성 탄소 흡착제 적용"}
                                </h3>
                                <p className="text-blue-50 text-sm leading-relaxed">
                                    {isVocs 
                                        ? "입력된 풍량과 온도를 기반으로 유체역학적 차압 계산이 완료되었습니다. 물리적 응축 방식을 적용하여 VOCs를 회수하고 압력 손실을 최소화하는 시스템을 설계했습니다."
                                        : "복합 악취 및 산성 가스 제거를 위해 비표면적을 극대화한 탄소 흡착제를 처방합니다. 촉매 반응을 통해 최고 수준의 악취 제거 효율을 기대할 수 있습니다."}
                                </p>
                            </div>
                            <div className="bg-white/10 rounded-2xl p-6 text-center w-full md:w-48">
                                <div className="text-blue-100 text-sm mb-2 font-medium">예상 악취 제거 효율</div>
                                <div className="text-5xl font-black text-white">{isVocs ? '95' : '99'}<span className="text-2xl">%</span></div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function VideoView({ selectedOdor }) {
            const isVocs = selectedOdor === 'vocs';
            const videos = isVocs ? [
                { id: 'T_mptCb0Qq8', title: "태성환경연구소 악취 통합솔루션", desc: "물리적 응축 및 VOCs 제어" },
                { id: 'rMtsyx46hDM', title: "악취 모니터링 장비 출품 (AIR FAIR)", desc: "유증기 유출 실시간 감지" },
                { id: 'XCvC0ckXjl0', title: "태성드론 소개", desc: "상공 VOCs 포집 및 정밀 측정" }
            ] : [
                { id: 'PO7REfpXxOM', title: "여천매립지 악취방지 대책", desc: "복합 악취(H2S, NH3) 저감" },
                { id: 'vq2-MdIsaiE', title: "울산 세계 미래산업 박람회", desc: "다공성 탄소 흡착제 기술 소개" },
                { id: 'T_mptCb0Qq8', title: "맞춤형 흡착탑 설계 및 시공", desc: "화학공학 기반 악취 솔루션" }
            ];

            return (
                <div className="bg-white rounded-2xl p-8 shadow-sm border border-slate-200 animate-fade-in">
                    <div className="mb-8">
                        <h3 className="text-xl font-bold text-slate-800 mb-2">📺 AI 맞춤형 영상 큐레이션</h3>
                        <p className="text-slate-500 text-sm">당사가 보유한 230개의 유튜브 영상 중, 현재 솔루션에 가장 적합한 3개를 AI가 선별했습니다.</p>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {videos.map((video, idx) => (
                            <a key={idx} href={`https://www.youtube.com/watch?v=${video.id}`} target="_blank" className="group block">
                                <div className="aspect-video rounded-xl bg-slate-900 mb-3 overflow-hidden relative shadow-md">
                                    <img src={`https://img.youtube.com/vi/${video.id}/hqdefault.jpg`} className="w-full h-full object-cover opacity-80 group-hover:opacity-100 group-hover:scale-105 transition-all" />
                                    <div className="absolute inset-0 flex items-center justify-center">
                                        <div className="w-12 h-12 bg-red-600 rounded-full flex items-center justify-center text-white text-xl">▶</div>
                                    </div>
                                </div>
                                <h4 className="font-bold text-slate-800 leading-tight group-hover:text-blue-600 transition-colors">{video.title}</h4>
                                <p className="text-sm text-slate-500 mt-1">{video.desc}</p>
                            </a>
                        ))}
                    </div>
                </div>
            );
        }

        function ManagementView() {
            return (
                <div className="animate-fade-in bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
                    <h3 className="text-xl font-bold mb-4 text-slate-800">📊 디지털 트윈 관제 대시보드</h3>
                    <p className="text-slate-500 mb-6">현장 모니터링 및 AI 역추적 시뮬레이션 화면이 표시됩니다.</p>
                    <div className="bg-slate-900 rounded-xl p-8 text-center border border-slate-700">
                        <div className="text-red-400 font-bold mb-2">⚠️ AI 예지보전 알림</div>
                        <p className="text-slate-300">1공장 옥상 세정집진기 pH 농도 저하 감지. 48시간 내 약품 보충이 필요합니다.</p>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
