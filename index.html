<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바로고시스템 - 태성환경연구소</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Pretendard Font -->
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f8fafc; margin: 0; padding: 0; }
        
        /* View Transition Animations */
        .view-enter { animation: viewFadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes viewFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* SVG Radar & Area Chart Animations */
        .radar-poly { transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .area-line-anim {
            stroke-dasharray: 2000;
            stroke-dashoffset: 2000;
            animation: drawLine 1.8s ease-out forwards;
        }
        .area-fill-anim {
            opacity: 0;
            animation: fadeInFill 1.2s ease-out 0.4s forwards;
        }
        @keyframes drawLine { to { stroke-dashoffset: 0; } }
        @keyframes fadeInFill { to { opacity: 1; } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ==========================================
        // 1. Lucide Icons (영상 속 원본 벡터 아이콘 완벽 구현)
        // ==========================================
        const SvgIcon = ({ size = 20, className = "", children }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const Home = (p) => <SvgIcon {...p}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></SvgIcon>;
        const ClipboardList = (p) => <SvgIcon {...p}><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></SvgIcon>;
        const Stethoscope = (p) => <SvgIcon {...p}><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/></SvgIcon>;
        const Video = (p) => <SvgIcon {...p}><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></SvgIcon>;
        const BarChart3 = (p) => <SvgIcon {...p}><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></SvgIcon>;
        const User = (p) => <SvgIcon {...p}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></SvgIcon>;
        const Bell = (p) => <SvgIcon {...p}><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></SvgIcon>;
        const Settings = (p) => <SvgIcon {...p}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></SvgIcon>;
        const ChevronRight = (p) => <SvgIcon {...p}><path d="m9 18 6-6-6-6"/></SvgIcon>;
        const CheckCircle2 = (p) => <SvgIcon {...p}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></SvgIcon>;
        const CheckCircle = (p) => <SvgIcon {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></SvgIcon>;
        const AlertTriangle = (p) => <SvgIcon {...p}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></SvgIcon>;
        const Activity = (p) => <SvgIcon {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></SvgIcon>;
        const Wind = (p) => <SvgIcon {...p}><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></SvgIcon>;
        const Thermometer = (p) => <SvgIcon {...p}><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></SvgIcon>;
        const Factory = (p) => <SvgIcon {...p}><path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M17 18h1"/><path d="M12 18h1"/><path d="M7 18h1"/></SvgIcon>;
        const PlayCircle = (p) => <SvgIcon {...p}><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></SvgIcon>;
        const FileText = (p) => <SvgIcon {...p}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></SvgIcon>;

        // ==========================================
        // 2. Custom SVG Charts (영상 속 Recharts 100% 재현)
        // ==========================================
        
        // 다차원 악취 지문 레이더 차트
        function OdorRadarChart({ data }) {
            const [hoverIdx, setHoverIdx] = useState(null);
            const cx = 250;
            const cy = 165;
            const R = 115;
            const levels = [25, 50, 75, 100];

            // 6각형 각도 계산 (상단 -90도부터 시계방향)
            const getPoint = (val, idx) => {
                const angle = (-90 + idx * 60) * (Math.PI / 180);
                const r = (val / 100) * R;
                return {
                    x: cx + r * Math.cos(angle),
                    y: cy + r * Math.sin(angle)
                };
            };

            const polyPoints = data.map((d, i) => {
                const pt = getPoint(d.A, i);
                return `${pt.x},${pt.y}`;
            }).join(' ');

            return (
                <div className="relative w-full h-80 flex items-center justify-center select-none">
                    <svg viewBox="0 0 500 330" className="w-full h-full max-w-lg overflow-visible">
                        {/* 6각형 그리드 배경 */}
                        {levels.map((lvl) => {
                            const pts = [0, 1, 2, 3, 4, 5].map(i => {
                                const pt = getPoint(lvl, i);
                                return `${pt.x},${pt.y}`;
                            }).join(' ');
                            return <polygon key={lvl} points={pts} fill="none" stroke="#e2e8f0" strokeWidth="1" />;
                        })}

                        {/* 중심에서 꼭짓점으로 뻗는 축선 */}
                        {[0, 1, 2, 3, 4, 5].map(i => {
                            const pt = getPoint(100, i);
                            return <line key={i} x1={cx} y1={cy} x2={pt.x} y2={pt.y} stroke="#e2e8f0" strokeWidth="1" />;
                        })}

                        {/* 반경 수치 텍스트 (0, 25, 50, 75, 100) */}
                        {[0, 25, 50, 75, 100].map((lvl) => {
                            const angle = -30 * (Math.PI / 180); // 우측 상단 축 기준 표시
                            const r = (lvl / 100) * R;
                            const tx = cx + r * Math.cos(angle);
                            const ty = cy + r * Math.sin(angle);
                            return (
                                <text key={lvl} x={tx} y={ty - 4} fill="#94a3b8" fontSize="10" textAnchor="middle">
                                    {lvl}
                                </text>
                            );
                        })}

                        {/* 측정 데이터 다각형 */}
                        <polygon points={polyPoints} fill="#10b981" fillOpacity="0.4" stroke="#10b981" strokeWidth="2" className="radar-poly" />

                        {/* 각 항목 라벨 및 호버 포인트 */}
                        {data.map((d, i) => {
                            const labelPt = getPoint(122, i);
                            const dataPt = getPoint(d.A, i);
                            let anchor = "middle";
                            if (i === 1 || i === 2) anchor = "start";
                            if (i === 4 || i === 5) anchor = "end";

                            return (
                                <g key={i}>
                                    <text 
                                        x={labelPt.x} 
                                        y={labelPt.y + 4} 
                                        fill="#475569" 
                                        fontSize="12" 
                                        fontWeight="600" 
                                        textAnchor={anchor}
                                    >
                                        {d.subject}
                                    </text>
                                    <circle 
                                        cx={dataPt.x} 
                                        cy={dataPt.y} 
                                        r="5" 
                                        fill="#10b981" 
                                        className="cursor-pointer opacity-0 hover:opacity-100 transition-opacity"
                                        onMouseEnter={() => setHoverIdx(i)}
                                        onMouseLeave={() => setHoverIdx(null)}
                                    />
                                </g>
                            );
                        })}
                    </svg>

                    {/* 툴팁 */}
                    {hoverIdx !== null && (
                        <div className="absolute bg-white/95 backdrop-blur px-3 py-2 rounded-lg shadow-md border border-slate-200 text-xs pointer-events-none top-4 right-4">
                            <p className="font-bold text-slate-700">{data[hoverIdx].subject}</p>
                            <p className="text-emerald-600 font-semibold">측정치 : {data[hoverIdx].A}</p>
                        </div>
                    )}
                </div>
            );
        }

        // 실시간 VOCs 배출량 트렌드 영역 차트
        function VocsTrendChart({ data }) {
            const [hoverIdx, setHoverIdx] = useState(null);
            const width = 650;
            const height = 260;
            const padL = 42;
            const padR = 20;
            const padT = 20;
            const padB = 45;

            const plotW = width - padL - padR;
            const plotH = height - padT - padB;
            const maxY = 160;

            const getCoords = (val, idx) => {
                const x = padL + (idx / (data.length - 1)) * plotW;
                const y = padT + plotH - (val / maxY) * plotH;
                return { x, y };
            };

            const pts = data.map((d, i) => getCoords(d.vocs, i));

            // 부드러운 곡선(Monotone Cubic Bezier) 경로 생성
            const buildSmoothPath = (points) => {
                if (points.length === 0) return "";
                let d = `M ${points[0].x},${points[0].y}`;
                for (let i = 0; i < points.length - 1; i++) {
                    const p0 = points[i];
                    const p1 = points[i + 1];
                    const cpx1 = p0.x + (p1.x - p0.x) * 0.45;
                    const cpy1 = p0.y;
                    const cpx2 = p0.x + (p1.x - p0.x) * 0.55;
                    const cpy2 = p1.y;
                    d += ` C ${cpx1},${cpy1} ${cpx2},${cpy2} ${p1.x},${p1.y}`;
                }
                return d;
            };

            const linePath = buildSmoothPath(pts);
            const baseLineY = padT + plotH;
            const areaPath = `${linePath} L ${pts[pts.length - 1].x},${baseLineY} L ${pts[0].x},${baseLineY} Z`;
            const limitY = getCoords(100, 0).y;

            return (
                <div className="relative w-full h-72 select-none">
                    <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-full overflow-visible">
                        <defs>
                            <linearGradient id="colorVocs" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="5%" stopColor="#10b981" stopOpacity="0.3"/>
                                <stop offset="95%" stopColor="#10b981" stopOpacity="0.0"/>
                            </linearGradient>
                        </defs>

                        {/* Y축 그리드 라인 및 수치 (0, 40, 80, 120, 160) */}
                        {[0, 40, 80, 120, 160].map((val) => {
                            const y = padT + plotH - (val / maxY) * plotH;
                            return (
                                <g key={val}>
                                    <line x1={padL} y1={y} x2={width - padR} y2={y} stroke="#e2e8f0" strokeDasharray="3 3" />
                                    <text x={padL - 10} y={y + 4} fill="#64748b" fontSize="11" textAnchor="end">{val}</text>
                                </g>
                            );
                        })}

                        {/* X축 시간 라벨 */}
                        {data.map((d, i) => {
                            const { x } = getCoords(0, i);
                            return (
                                <text key={i} x={x} y={baseLineY + 22} fill="#64748b" fontSize="11" textAnchor="middle">
                                    {d.time}
                                </text>
                            );
                        })}

                        {/* 그라데이션 영역 채우기 */}
                        <path d={areaPath} fill="url(#colorVocs)" className="area-fill-anim" />

                        {/* VOCs 농도 파란색 곡선 */}
                        <path d={linePath} fill="none" stroke="#3b82f6" strokeWidth="3" className="area-line-anim" />

                        {/* 배출허용기준 빨간색 점선 (100 ppm) */}
                        <line x1={padL} y1={limitY} x2={width - padR} y2={limitY} stroke="#ef4444" strokeWidth="2" strokeDasharray="5 5" />

                        {/* 마우스 인터랙션 영역 */}
                        {pts.map((pt, i) => (
                            <g key={i}>
                                {hoverIdx === i && (
                                    <>
                                        <line x1={pt.x} y1={padT} x2={pt.x} y2={baseLineY} stroke="#cbd5e1" strokeDasharray="3 3" />
                                        <circle cx={pt.x} cy={pt.y} r="5" fill="#3b82f6" stroke="#ffffff" strokeWidth="2" />
                                    </>
                                )}
                                <rect 
                                    x={pt.x - plotW / (data.length * 2)} 
                                    y={padT} 
                                    width={plotW / data.length} 
                                    height={plotH} 
                                    fill="transparent" 
                                    className="cursor-pointer"
                                    onMouseEnter={() => setHoverIdx(i)}
                                    onMouseLeave={() => setHoverIdx(null)}
                                />
                            </g>
                        ))}
                    </svg>

                    {/* 하단 범례 (Legend) */}
                    <div className="flex items-center justify-center gap-6 text-xs font-medium -mt-3">
                        <div className="flex items-center gap-1.5 text-blue-500">
                            <span className="inline-block w-3.5 h-0.5 bg-blue-500 relative">
                                <span className="w-1.5 h-1.5 rounded-full bg-blue-500 absolute -top-0.5 left-1"></span>
                            </span>
                            <span>VOCs 농도 (ppm)</span>
                        </div>
                        <div className="flex items-center gap-1.5 text-red-500">
                            <span className="inline-block w-3.5 border-b-2 border-dashed border-red-500"></span>
                            <span>배출허용기준</span>
                        </div>
                    </div>

                    {/* 차트 호버 툴팁 */}
                    {hoverIdx !== null && (
                        <div 
                            className="absolute bg-white px-3.5 py-2.5 rounded-xl shadow-lg border border-slate-100 text-xs pointer-events-none transition-all z-20"
                            style={{ 
                                left: `${Math.min(Math.max((hoverIdx / (data.length - 1)) * 80 + 5, 10), 75)}%`, 
                                top: '20px' 
                            }}
                        >
                            <p className="font-bold text-slate-700 mb-1">{data[hoverIdx].time}</p>
                            <p className="text-blue-600 font-semibold">VOCs 농도 (ppm) : {data[hoverIdx].vocs}</p>
                            <p className="text-red-500 font-semibold">배출허용기준 : {data[hoverIdx].limit}</p>
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // 3. 메인 애플리케이션 컴포넌트 (영상과 100% 일치)
        // ==========================================
        function BareugoApp() {
            const [activeTab, setActiveTab] = useState('overview');
            const [selectedOdor, setSelectedOdor] = useState('vocs');

            const navItems = [
                { id: 'overview', label: '🏥 종합안내', icon: Home },
                { id: 'intake', label: '📝 접수·문진', icon: ClipboardList },
                { id: 'diagnosis', label: '🔬 AI 진단 및 설계', icon: Stethoscope },
                { id: 'video', label: '📺 AI 영상 처방전', icon: Video },
                { id: 'management', label: '🌐 디지털트윈 관제', icon: BarChart3 },
            ];

            return (
                <div className="flex h-screen bg-slate-50 font-sans text-slate-800 overflow-hidden">
                    {/* Sidebar */}
                    <aside className="w-64 bg-slate-900 text-white flex flex-col shadow-xl z-10 shrink-0">
                        <div className="p-6 flex items-center gap-3 border-b border-slate-700">
                            <div className="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-xl shadow-lg shadow-blue-600/30">B</div>
                            <div>
                                <h1 className="text-xl font-bold tracking-tight">바로고시스템<span className="text-blue-400">.</span></h1>
                                <p className="text-xs text-slate-400">악취종합병원 AI 솔루션</p>
                            </div>
                        </div>
                        
                        <nav className="flex-1 py-6 px-4 space-y-2 overflow-y-auto">
                            {navItems.map((item) => {
                                const Icon = item.icon;
                                const isActive = activeTab === item.id;
                                return (
                                    <button
                                        key={item.id}
                                        onClick={() => setActiveTab(item.id)}
                                        className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 text-left ${
                                            isActive 
                                                ? 'bg-blue-500/10 text-blue-400 border border-blue-500/20 shadow-sm' 
                                                : 'text-slate-400 hover:bg-slate-800 hover:text-white'
                                        }`}
                                    >
                                        <Icon size={20} className={isActive ? 'text-blue-400' : ''} />
                                        <span className="font-medium text-sm">{item.label}</span>
                                    </button>
                                );
                            })}
                        </nav>

                        <div className="p-4 border-t border-slate-800">
                            <div className="flex items-center gap-3 px-2 py-2">
                                <div className="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center">
                                    <User size={16} />
                                </div>
                                <div className="text-sm">
                                    <p className="font-medium text-slate-200">태성환경연구소</p>
                                    <p className="text-xs text-slate-500">관리자 계정</p>
                                </div>
                            </div>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 flex flex-col h-full overflow-hidden">
                        {/* Top Header */}
                        <header className="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 shrink-0">
                            <h2 className="text-lg font-semibold text-slate-800">
                                {navItems.find(i => i.id === activeTab)?.label.split(' ')[1]}
                            </h2>
                            <div className="flex items-center gap-4">
                                <button className="relative p-2 text-slate-400 hover:text-slate-600 transition-colors">
                                    <Bell size={20} />
                                    <span className="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                                </button>
                                <button className="p-2 text-slate-400 hover:text-slate-600 transition-colors">
                                    <Settings size={20} />
                                </button>
                            </div>
                        </header>

                        {/* Dynamic Content Area */}
                        <div className="flex-1 overflow-auto p-8">
                            <div className="max-w-6xl mx-auto">
                                {activeTab === 'overview' && <OverviewView setActiveTab={setActiveTab} />}
                                {activeTab === 'intake' && <IntakeView setActiveTab={setActiveTab} setSelectedOdor={setSelectedOdor} />}
                                {activeTab === 'diagnosis' && <DiagnosisView selectedOdor={selectedOdor} />}
                                {activeTab === 'video' && <VideoView selectedOdor={selectedOdor} />}
                                {activeTab === 'management' && <ManagementView />}
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        // 1. 종합안내 (Overview)
        function OverviewView({ setActiveTab }) {
            return (
                <div className="space-y-8 view-enter">
                    <div className="relative overflow-hidden rounded-3xl bg-slate-900 text-white p-10 md:p-14 shadow-2xl">
